---
- name: MKTCPIP on AIX
  hosts: "{{ host_name }}"
  gather_facts: false
  vars:
    host_name: all
    address_v: X.X.X.X
    nameserver_v: X.X.X.X
    interface_v: en0
    domain_v: dummy_host
  tasks:
    - name: Set the required values for starting TCP/IP
      ibm.power_aix.mktcpip:
        hostname: test_hostname
        address: "{{ address_v }}"
        interface: "{{ interface_v }}"
        nameserver: "{{ nameserver_v }}"
        domain: "{{ domain_v }}"
        start_daemons: true

---
- name: BOS install using mksysb image
  hosts: nimserver
  gather_facts: false
  vars:
    vm_targets: quimby01
    res_group: basic_res_grp

  tasks:
    - name: Install using group resource
      ibm.power_aix.nim:
        action: bos_inst
        targets: "{{ vm_targets }}"
        group: "{{ res_group }}"
      register: result
    - name: Display nim install result
      ansible.builtin.debug:
        var: result

---
- name: FILESYSTEM on AIX
  hosts: "{{host_name}}"
  gather_facts: false
  remote_user: root
  vars:
    host_name: ALL
    filesystem_name: /mnt4
    fs_type_v: jfs2
    mount_group_v: test
    permissions_v: rw
    vg_v: rw
    options_value: "rw,noatime,nosuid"

  tasks:
    - name: Creation of a JFS2 filesystem
      ibm.power_aix.filesystem:
        state: present
        filesystem: "{{ filesystem_name }}"
        fs_type: "{{ fs_type_v }}"
        attributes: size=32768,isnapshot='no'
        mount_group: "{{ mount_group_v }}"
        permissions: "{{ permissions_v }}"
        vg: "{{ vg_v }}"
    - name: Increase size of a filesystem
      ibm.power_aix.filesystem:
        filesystem: "{{ filesystem_name }}"
        state: present
        attributes: size=+5M
    - name: Remove a NFS filesystem
      ibm.power_aix.filesystem:
        filesystem: "{{ filesystem_name }}"
        state: absent
        rm_mount_point: true
    - name: Set options on filesystem
      ibm.power_aix.filesystem:
        filesystem: /testing123
        attributes:
          - "options={{ options_value }}"
        auto_mount: 'yes'
        state: present

    - name: Set options on filesystem idem
      ibm.power_aix.filesystem:
        filesystem: /testing123
        attributes:
          - "options={{ options_value }}"
        auto_mount: 'yes'
        state: present

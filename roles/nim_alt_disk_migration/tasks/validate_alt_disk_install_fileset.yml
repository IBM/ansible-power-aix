---
############################################################
############################################################
# Validations:
# 1. check if 'bos.alt_disk_install.rte' fileset is
#    installed in NIM master
#
# 2. check if 'bos.alt_disk_install.rte' fileset is
#    installed in nim_alt_disk_migration_lpp_source
#
# 3. check if 'bos.alt_disk_install.rte' fileset is
#    installed in spot, if NOT then customize SPOT
#    resource and install the fileset using nim_alt_disk_migration_lpp_source
#
# 4. check if the 'bos.alt_disk_install.rte' fileset
#    is on the same level for NIM master, nim_alt_disk_migration_lpp_source
#    and nim_alt_disk_migration_spot

############################################################
############################################################
- name: Query bos.alt_disk_install.rte fileset in NIM master
  ibm.power_aix.lpp_facts:
    filesets: bos.alt_disk_install.rte

- name: Set NIM master fileset levels
  ansible.builtin.set_fact:
    nim_alt_disk_migration_nim_master_fileset_levels: >
      {{ ansible_facts['filesets']['bos.alt_disk_install.rte']['levels'].keys() | list }}

- name: Check if 'bos.alt_disk_install.rte is installed in NIM master
  ansible.builtin.fail:
    msg: Fileset 'bos.alt_disk_install.rte' not installed in NIM master
  when: "'bos.alt_disk_install.rte' not in ansible_facts.filesets"
- name: Display NIM master fileset level
  ansible.builtin.debug:
    msg: >
      'bos.alt_disk_install.rte' in NIM master is at
      level {{ nim_alt_disk_migration_nim_master_fileset_levels }}

############################################################
############################################################

- name: Query bos.alt_disk_install.rte fileset {{ nim_alt_disk_migration_lpp_source }}
  ibm.power_aix.nim_resource:
    action: show
    name: "{{ nim_alt_disk_migration_lpp_source }}"
    showres:
      fetch_contents: true
  register: nim_alt_disk_migration_lpp_source_query

- name: Check if 'bos.alt_disk_install.rte is in {{ nim_alt_disk_migration_lpp_source }}
  block:
    - name: Set LPP source fileset contents
      ansible.builtin.set_fact:
        nim_alt_disk_migration_lpp_source_fileset:
          "{{ nim_alt_disk_migration_lpp_source_query['nim_resources'][nim_alt_disk_migration_lpp_source]['contents'] }}"

    - name: Fail if bos.alt_disk_install.rte not in LPP source
      ansible.builtin.fail:
        msg: Fileset 'bos.alt_disk_install.rte' not in {{ nim_alt_disk_migration_lpp_source }}
      when: nim_alt_disk_migration_lpp_source_fileset['bos.alt_disk_install.rte'] is not defined

    - name: Display fileset defined status
      ansible.builtin.debug:
        msg: '"defined"'
      when: nim_alt_disk_migration_lpp_source_fileset['bos.alt_disk_install.rte'] is defined

    - name: Set LPP source fileset level
      ansible.builtin.set_fact:
        nim_alt_disk_migration_lpp_source_fileset_level: "{{ nim_alt_disk_migration_lpp_source_fileset['bos.alt_disk_install.rte'] }}"
    - name: Extract first level from LPP source fileset
      ansible.builtin.set_fact:
        nim_alt_disk_migration_lpp_source_fileset_level: "{{ nim_alt_disk_migration_lpp_source_fileset_level['level'] | first }}"

    - name: Display LPP source fileset level
      ansible.builtin.debug:
        msg: >
          'bos.alt_disk_install.rte' in {{ nim_alt_disk_migration_lpp_source }} is at
          level '{{ nim_alt_disk_migration_lpp_source_fileset_level }}'

############################################################
############################################################

- name: Query bos.alt_disk_install.rte fileset in {{ nim_alt_disk_migration_spot }}
  when: nim_alt_disk_migration_spot != ""

  ############################################################
  ############################################################

  block:
    - name: Query SPOT resource for fileset contents
      ibm.power_aix.nim_resource:
        action: show
        name: "{{ nim_alt_disk_migration_spot }}"
        showres:
          fetch_contents: true
      register: nim_alt_disk_migration_spot_query

    # if 'bos.alt_disk_install.rte' is not installed in SPOT then install it
    - name: Set SPOT fileset contents
      ansible.builtin.set_fact:
        nim_alt_disk_migration_spot_fileset: "{{ nim_alt_disk_migration_spot_query['nim_resources'][nim_alt_disk_migration_spot]['contents'] }}"

    - name: Install bos.alt_disk_install.rte if not present in SPOT
      ansible.builtin.include_tasks: add_alt_disk_install_fileset.yml
      when: nim_alt_disk_migration_spot_fileset['bos.alt_disk_install.rte'] is not defined

    - name: Re-query SPOT resource after installation
      ibm.power_aix.nim_resource:
        action: show
        name: "{{ nim_alt_disk_migration_spot }}"
        showres:
          fetch_contents: true
      register: nim_alt_disk_migration_spot_query

    - name: Update SPOT fileset contents
      ansible.builtin.set_fact:
        nim_alt_disk_migration_spot_fileset: "{{ nim_alt_disk_migration_spot_query['nim_resources'][nim_alt_disk_migration_spot]['contents'] }}"
    - name: Set SPOT fileset level
      ansible.builtin.set_fact:
        nim_alt_disk_migration_spot_fileset_level: "{{ nim_alt_disk_migration_spot_fileset['bos.alt_disk_install.rte']['level'] | first }}"

    - name: Display SPOT fileset level
      ansible.builtin.debug:
        msg: >
          'bos.alt_disk_install.rte' in {{ nim_alt_disk_migration_spot }} is at
          level '{{ nim_alt_disk_migration_spot_fileset_level }}'
- name: Check if 'bos.alt_disk_install.rte' fileset level matches between NIM master and {{ nim_alt_disk_migration_lpp_source }}
  block:
    - name: Set NIM master fileset level from list
      ansible.builtin.set_fact:
        nim_alt_disk_migration_nim_master_fileset_level: >
          {{ nim_alt_disk_migration_nim_master_fileset_levels.0 }}
    - name: Split NIM master fileset level into major and minor
      ansible.builtin.set_fact:
        nim_alt_disk_migration_nim_master_fileset_level_major_num: "{{ nim_alt_disk_migration_nim_master_fileset_level.split('.')[0] }}"
        nim_alt_disk_migration_nim_master_fileset_level_minor_num: "{{ nim_alt_disk_migration_nim_master_fileset_level.split('.')[1] }}"
    - name: Format NIM master fileset level as four-digit number
      ansible.builtin.set_fact:
        nim_alt_disk_migration_nim_master_fileset_level: >
          {{ nim_alt_disk_migration_nim_master_fileset_level_major_num + nim_alt_disk_migration_nim_master_fileset_level_minor_num + '00' }}

    - name: Split LPP source fileset level into major and minor
      ansible.builtin.set_fact:
        nim_alt_disk_migration_lpp_source_fileset_level_major_num: "{{ nim_alt_disk_migration_lpp_source_fileset_level.split('.')[0] }}"
        nim_alt_disk_migration_lpp_source_fileset_level_minor_num: "{{ nim_alt_disk_migration_lpp_source_fileset_level.split('.')[1] }}"
    - name: Format LPP source fileset level as four-digit number
      ansible.builtin.set_fact:
        nim_alt_disk_migration_lpp_source_fileset_level: >
          {{ nim_alt_disk_migration_lpp_source_fileset_level_major_num + nim_alt_disk_migration_lpp_source_fileset_level_minor_num + '00' }}

    - name: Fail if LPP source level higher than NIM master
      ansible.builtin.fail:
        msg: >
          NIM master and {{ nim_alt_disk_migration_lpp_source }} 'bos.alt_disk_install.rte'
          fileset level
          {{ nim_alt_disk_migration_lpp_source_fileset_level }} > {{ nim_alt_disk_migration_nim_master_fileset_level }}
          fileset levels invalid - LPP Source cannot be higher than NIM Master
      when: nim_alt_disk_migration_lpp_source_fileset_level > nim_alt_disk_migration_nim_master_fileset_level

############################################################
############################################################

- name: Check if 'bos.alt_disk_install.rte' fileset level matches between NIM master and {{ nim_alt_disk_migration_spot }}
  when: nim_alt_disk_migration_spot != ""

  ############################################################
  ############################################################

  block:
    - name: Fail if SPOT fileset level not in NIM master levels
      ansible.builtin.fail:
        msg: >
          NIM master and {{ nim_alt_disk_migration_spot }} 'bos.alt_disk_install.rte'
          {{ nim_alt_disk_migration_spot_fileset_level }} not in {{ nim_alt_disk_migration_nim_master_fileset_levels }}
          fileset levels do not match
          Install 'bos.alt_disk_install.rte' from {{ nim_alt_disk_migration_nim_master_fileset_level }} into {{ nim_alt_disk_migration_spot }}
      when: nim_alt_disk_migration_spot_fileset_level not in nim_alt_disk_migration_nim_master_fileset_levels
- name: Check if 'bos.alt_disk_install.rte' fileset level matches between lpp_source spot.
  when: nim_alt_disk_migration_spot != ""
  block:
    - name: Split SPOT fileset level into major and minor
      ansible.builtin.set_fact:
        nim_alt_disk_migration_spot_fileset_level_major_num: "{{ nim_alt_disk_migration_spot_fileset_level.split('.')[0] }}"
        nim_alt_disk_migration_spot_fileset_level_minor_num: "{{ nim_alt_disk_migration_spot_fileset_level.split('.')[1] }}"
    - name: Format SPOT fileset level as four-digit number
      ansible.builtin.set_fact:
        nim_alt_disk_migration_spot_fileset_level: >
          {{ nim_alt_disk_migration_spot_fileset_level_major_num + nim_alt_disk_migration_spot_fileset_level_minor_num + '00' }}

    - name: Fail if SPOT level lower than LPP source
      ansible.builtin.fail:
        msg: >
          {{ nim_alt_disk_migration_lpp_source }} and {{ nim_alt_disk_migration_spot }} 'bos.alt_disk_install.rte'
          {{ nim_alt_disk_migration_spot_fileset_level }} < {{ nim_alt_disk_migration_lpp_source_fileset_level }}
          fileset levels are not supported - LPP Source cannot be higher than SPOT

      when: nim_alt_disk_migration_spot_fileset_level < nim_alt_disk_migration_lpp_source_fileset_level
